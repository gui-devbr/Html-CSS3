<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <style>
        div.conteiner {
            display:flex;
            background-color:purple;
            height:200px;
        }

        

        
div {
    background-color: aqua;
    display:block;
    padding:20px;
    border: 1px solid black;
    margin:3px;
}
         
            #i1 {
                order: 0;

                align-self:auto;
            }

            #i2 {
                order:1;

                align-self:flex-start;
            }

            #i3 {
                order: 2;
               align-self:flex-end;
            }
        
            #i4 {
                order:3;
                align-self:center;
            }

            #i5 {
                order:4;
                align-self:stretch;
            }

            #i6 {
                order:5;
                align-self:center;
            }

            #i7 {
                order:6;
                align-self:flex-start;
            }




    </style>
</head>
<body>
    <div class="conteiner">
        <div id="i1"  >A</div>
         <div id="i2" >B</div>
         <div id="i3" >C</div>
          <div  id="i4">D</div>
            <div  id="i5">E</div>
             <div  id="i6">F</div>
              <div  id="i7">G</div>
    </div>
    
</body>
</html>
